#
# https://github.com/quanjindeng/Actions_OpenWrt
#

name: Build OpenWrt-imm

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: 0 16 4,9,14,19,24,28,31 * *

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config-imm-x86
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-imm-x86.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  USE_CCACHE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    steps:
    - name: 创建编译空间挂载点
      run: |
        sudo mkdir -p /mnt/workdir
        sudo chown $USER:$GROUPS /mnt/workdir

    - name: 最大化编译空间
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 4096
        build-mount-path: /mnt/workdir
        overprovision-lvm: 'true'
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Checkout
      uses: actions/checkout@v6

    - name: 检查服务器配置
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo "云编译建议取消勾选Node.js及其相关插件！"
        echo "已知CPU型号（降序）：8370C,8272CL,8171M,E5系列"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量:$(cat /proc/cpuinfo| grep "physical id"| sort| uniq| wc -l)"
        echo -e "CPU核心及版本信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        sudo lshw -short -C memory | grep GiB || true
        echo -e "\n"
        echo "--------------------------硬盘信息--------------------------"
        echo -e  "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l) \n" || true
        echo "硬盘详情："
        df -Th

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt update -y
        sudo apt full-upgrade -y
        sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
        g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
        libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
        libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
        ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
        python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
        upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo timedatectl set-timezone "$TZ"

    - name: 克隆源码
      working-directory: /mnt/workdir
      run: |
        df -hT $PWD || true
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /mnt/workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 加载自定义feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: 安装feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: 加载自定义配置并强制开启 ccache
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        # 强制在内核配置中启用 ccache 机制
        echo "CONFIG_CCACHE=y" >> openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 确保 ccache 基础目录存在
      run: |
        # 仅需为 ccache 创建预留目录。Toolchain 和 host 会由 make 自动生成真实物理目录。
        mkdir -p /mnt/workdir/openwrt/.ccache

    - name: 验证 Kconfig / 配置冲突（快速失败并打印定位信息）
      run: |
        cd openwrt
        set -o pipefail
        if ! make defconfig 2>&1 | tee make_defconfig.log; then
          echo "make defconfig 返回非零（可能存在 Kconfig 冲突）"
        fi
        if grep -nE "recursive dependency detected|error:" tmp/.config-package.in >/dev/null 2>&1; then
          echo "==== 在 tmp/.config-package.in 中发现 Kconfig 递归/错误条目 ===="
          grep -nE "recursive dependency detected|error:" tmp/.config-package.in | sed -n '1,30p' || true
          exit 1
        fi
        echo "Kconfig 检查通过"

    - name: 恢复工具链缓存
      uses: actions/cache@v4
      with:
        # 使用通配符涵盖附带 GCC 版本的 toolchain 实际目录，并修正 host 目录名
        # 去除 $GITHUB_WORKSPACE 软链接冗余，严格指定物理挂载路径
        path: |
          /mnt/workdir/openwrt/staging_dir/toolchain-*
          /mnt/workdir/openwrt/staging_dir/host
        key: ${{ runner.os }}-toolchain-x86-${{ hashFiles('openwrt/include/version.mk', 'openwrt/.config') }}
        restore-keys: |
          ${{ runner.os }}-toolchain-x86-

    - name: 恢复编译缓存 (ccache)
      uses: actions/cache@v4
      with:
        path: |
          /mnt/workdir/openwrt/.ccache
        key: ${{ runner.os }}-ccache-x86-${{ github.ref_name }}-${{ hashFiles('openwrt/.config') }}
        restore-keys: |
          ${{ runner.os }}-ccache-x86-${{ github.ref_name }}-
          ${{ runner.os }}-ccache-x86-
          ${{ runner.os }}-ccache-

    - name: 显示缓存恢复情况
      run: |
        echo "=== 缓存恢复检查 ==="
        ls -la /mnt/workdir/openwrt/staging_dir/ || true
        du -sh /mnt/workdir/openwrt/staging_dir/toolchain-* 2>/dev/null || echo "toolchain 缓存暂未生成"
        du -sh /mnt/workdir/openwrt/staging_dir/host 2>/dev/null || echo "host 缓存暂未生成"
        du -sh /mnt/workdir/openwrt/.ccache 2>/dev/null || echo "ccache 缓存暂未生成"

    - name: 下载软件包
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8 || (echo "make download 失败"; find dl -size -1024c -exec ls -l {} \; ; exit 1)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 配置 ccache（用于编译）
      run: |
        export CCACHE_DIR=/mnt/workdir/openwrt/.ccache
        ccache -M 5G || true
        echo "CCACHE_DIR=$CCACHE_DIR" >> $GITHUB_ENV

    - name: 编译固件
      id: compile
      env:
        CCACHE_DIR: /mnt/workdir/openwrt/.ccache
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        if make -j$(nproc) CCACHE_ENABLE=1; then
          echo "并行编译成功"
        else
          echo "并行编译失败，尝试单线程并输出详细日志"
          make -j1 || make -j1 V=s
        fi
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME || true
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 显示编译缓存统计
      if: always()
      run: |
        echo "=== ccache 编译统计 ==="
        if command -v ccache &> /dev/null; then
          ccache -s || true
        fi
        echo ""
        echo "=== 缓存大小统计 (验证真实路径体积) ==="
        du -sh /mnt/workdir/openwrt/staging_dir/toolchain-* 2>/dev/null || true
        du -sh /mnt/workdir/openwrt/staging_dir/host 2>/dev/null || true
        du -sh /mnt/workdir/openwrt/.ccache 2>/dev/null || true

    - name: 检查磁盘空间
      if: (!cancelled())
      run: df -hT

    - name: 整理文件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages profiles.json *.manifest *-kernel.bin *-rootfs.img *-rootfs.img.gz sha256sums
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件
      uses: actions/upload-artifact@v7
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_imm_x64_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 生成release标签
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 发布固件
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: 清理workflow
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3

    - name: 清理Releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 6
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
